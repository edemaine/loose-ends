<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loose Ends Workbench</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <link rel="stylesheet" href="/review_tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.3.0/dist/markdown-it.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@mdit/plugin-katex@1.0.1/dist/cdn.umd.js" defer></script>
  <script src="/review_model.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-tab="research" aria-label="Loose Ends home">
      <span class="brand-mark">LE</span>
      <span><strong>Loose Ends</strong><small>Research workbench</small></span>
    </button>
    <nav class="tabs" aria-label="Workbench sections">
      <button data-tab="research" class="active">Research</button>
      <button data-tab="papers">Papers</button>
      <button data-tab="manuscripts">Manuscripts</button>
      <button data-tab="activity">Activity <span id="activity-count" class="count"></span></button>
    </nav>
    <details id="scheduler-control" class="scheduler-control">
      <summary id="worker-summary">Workers</summary>
      <div class="scheduler-popover">
        <div class="scheduler-limit">
          <span>Maximum active workers</span>
          <div class="worker-stepper" role="group" aria-label="Maximum active workers">
            <button id="worker-decrease" type="button" aria-label="Decrease worker limit">−</button>
            <output id="worker-limit" aria-live="polite">2</output>
            <button id="worker-increase" type="button" aria-label="Increase worker limit">+</button>
          </div>
        </div>
        <div class="scheduler-worker-footer">
          <p id="worker-status"></p>
          <button id="queue-toggle" type="button" class="button"></button>
        </div>
        <div class="scheduler-memory-heading">Total worker memory limit and units</div>
        <div id="memory-value-row" class="memory-control-row">
          <div class="memory-value-control">
            <span id="memory-value-label" class="memory-unlimited-label" hidden>No limit</span>
            <div id="memory-stepper" class="memory-stepper" role="group" aria-label="Queue memory limit">
              <button id="memory-decrease" type="button" aria-label="Decrease queue memory limit">−</button>
              <input id="memory-value" type="number" min="0.1" step="1" aria-label="Queue memory limit value">
              <button id="memory-increase" type="button" aria-label="Increase queue memory limit">+</button>
            </div>
          </div>
          <div id="memory-mode" class="memory-mode" role="group" aria-label="Queue memory limit unit">
            <button type="button" data-memory-mode="percent" title="Percentage of installed RAM">%</button>
            <button type="button" data-memory-mode="gb" title="Fixed number of GB">GB</button>
            <button type="button" data-memory-mode="unlimited" title="No queue memory limit">∞</button>
          </div>
        </div>
        <p id="memory-status" class="memory-status"></p>
      </div>
    </details>
    <div id="connection" class="connection">Connecting…</div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div class="workspace">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>
  <div id="selection-bar" class="selection-bar" hidden></div>

  <dialog id="task-dialog" class="task-dialog">
    <form method="dialog" class="dialog-frame" id="task-form">
      <header class="dialog-header">
        <div>
          <div id="dialog-eyebrow" class="eyebrow">New task</div>
          <h2 id="dialog-title">Configure task</h2>
        </div>
        <button value="cancel" class="icon-button" aria-label="Close dialog">×</button>
      </header>
      <div id="dialog-body" class="dialog-body"></div>
      <footer id="dialog-footer" class="dialog-footer"></footer>
    </form>
  </dialog>

  <template id="empty-template">
    <section class="empty-state">
      <div class="empty-mark">∴</div>
      <h1>Nothing selected</h1>
      <p>Choose an item from the left to inspect its state and next actions.</p>
    </section>
  </template>
</body>
</html>
