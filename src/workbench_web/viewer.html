<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact · Loose Ends</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <link rel="stylesheet" href="/review_tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.3.0/dist/markdown-it.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@mdit/plugin-katex@1.0.1/dist/cdn.umd.js" defer></script>
  <script src="/review_model.js" defer></script>
  <script src="/viewer.js" defer></script>
</head>
<body class="viewer-body">
  <main class="viewer-shell">
    <header class="viewer-header">
      <div>
        <div class="eyebrow">Task artifact</div>
        <h1 id="viewer-title">Loading…</h1>
        <p id="viewer-path"></p>
      </div>
      <div class="viewer-actions">
        <button id="viewer-pdf-theme" class="button" type="button" hidden>Dark PDF: on</button>
        <a id="viewer-raw" class="button" target="_blank" rel="noopener noreferrer">Raw</a>
      </div>
    </header>
    <article id="viewer-content" class="viewer-content panel">
      <div class="loading">Loading artifact…</div>
    </article>
  </main>
</body>
</html>
